        隱私: # 資料自主權、反監控、去識別化、cross device tracking
        資安: # 漏洞攻擊、惡意軟體、資安防護、密碼學應用
        AI: # 大型語言模型、機器學習、生成式AI應用
        網路管制: # 言論管制、防火長城、數位威權主義
        自由軟體: # Free/Libre/Open Source Software
        雲端平台: # 大型跨國科技巨頭生態系與壟斷議題
            meta:
            apple:
            微軟:
            google:
            line:

        資料視覺化: # 統計圖表、資料科學呈現技術； 不包含單純地圖
    生醫科技:
政治: # 台灣國內政治人物、政黨相關
中國: # 中國內部的政治/經濟/法律/民生/教育/...等等事件
    香港:
    國有器官: # 中共系統性活摘民眾器官之直接與間接證據
    維權: # 中國欠缺法治所造成之民眾維護合法權益（如爛尾樓、維權律師）事件
    維吾爾族:
    中共內閧: # 高層權力鬥爭、清洗、派系角力
超限戰: # 對敵對國家的法律戰、破壞基礎設施、操作代理人(例如立法委員)、粉紅收屍隊、灰色地帶襲擾
    認知戰: # 協同造假行為、境外勢力心理滲透、資訊不對稱製造社會分裂； 公民反制認知戰的技術
        demoralization: # 亦即去道德化， Yuri Bezmenov 所警示之心理顛覆活動，例如塑造無力感、灌輸失敗主義、攻擊民主制度有效性、鼓勵厭惡政治的心態
    統戰: # 具有政治目的的 "交朋友"
    第五縱隊:
民生: # 公共議題當中， 與居住安全、公共安全、交通、就業/薪資/財產、水電、等等個人權益相關者；不包含宏觀經濟， 也不包含發噗者個人日常生活分享。
    防疫/公衛/食安: # 衛福部所管轄的主題
台灣國防:
    台灣主權:
    民防: # 防災準備、 戰時醫療、 全民防衛
國際: # 涉及台灣與中國之外其他國家的事件（如美選、歐盟法規）
人權: # 一般人權議題， 不含隱私、 科技產品的用戶權益
    言論自由: # 包含對言論自由的侵犯， 例如審查/河蟹
    兒童權益:
    性平: # 性別平等、性騷擾、女權、多元性別（LGBTQ+）議題
用戶權益: # 手機自主權、裝置維修權等等權益， 或是 DRM、restricted boot 等用戶權益受侵害情況
法律: # 法律條文、司法審判、法理討論（中國維權案除外）
經濟: # 總體經濟、產業趨勢、金融市場、跨國貿易
媒體識讀: # 事實查核、識別假訊息、拆解意識形態灌輸、提升公民免疫力
好笑: # 包含黑色幽默、諷刺、parody
欺騙: # 包含詐騙、政治謊言、企業欺瞞消費者； 不包含出處不明的假消息

教育: # 學校教育
文化: # (社會整體，而非個別活動的) 流行風潮、次文化如ACG、社會現象、meme、習俗
歷史: # 歷史事件、文史考證、集體記憶
心理: # 個人與群眾心理現象
