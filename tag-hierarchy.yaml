溝通: # 人/動物/LLM 之間九種排列的各種溝通，例如竉物溝通、夫妻、prompting、AI 諂媚； 但若「心理操控」、「辯論策略」、「欺騙」 等更精確的標籤更合適，則不採用此標籤。
哲理: # 人生智慧、價值觀、禪意、思辨哲學

