當責: # accountability 承擔決策的後果
軍事/戰爭: # 傳統正規軍事衝突、武器裝備、國防政策； 不含非傳統之超限戰、 認知戰。
矛盾: # 邏輯上的自我衝突、雙重標準、言行不一
注意力經濟: # 演算法餵養、流量變現、短影音成癮、點閱率至上主義
環保:
